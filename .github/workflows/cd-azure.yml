name: CD Azure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment.
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      mode:
        description: Run what-if only or deploy.
        required: true
        default: what-if
        type: choice
        options:
          - what-if
          - deploy
  pull_request:
    branches:
      - main
    paths:
      - infra/**
      - .github/workflows/cd-azure.yml
      - pipeline/.github/workflows/cd-azure.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-azure-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AZURE_LOCATION: southeastasia

jobs:
  validate:
    name: Validate Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        if: github.event_name == 'workflow_dispatch'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build root Bicep
        run: az bicep build --file infra/main.bicep

      - name: Build dev parameters
        run: az bicep build-params --file infra/parameters/dev.bicepparam --stdout > /dev/null

      - name: Build prod parameters
        run: az bicep build-params --file infra/parameters/prod.bicepparam --stdout > /dev/null

  what_if:
    name: Azure What-If
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    environment: azure-${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run subscription what-if
        run: |
          az deployment sub what-if \
            --name zt-${{ github.event.inputs.environment }}-${{ github.run_number }} \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/${{ github.event.inputs.environment }}.bicepparam

  deploy:
    name: Deploy Azure
    runs-on: ubuntu-latest
    needs: what_if
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'deploy'
    timeout-minutes: 30
    environment: azure-${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy subscription Bicep
        run: |
          az deployment sub create \
            --name zt-${{ github.event.inputs.environment }}-${{ github.run_number }} \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/${{ github.event.inputs.environment }}.bicepparam
