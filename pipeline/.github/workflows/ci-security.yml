name: CI Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets / Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 detect \
              --source /repo \
              --config /repo/.gitleaks.toml \
              --no-git \
              --redact \
              --verbose

  sast:
    name: SAST / Semgrep
    runs-on: ubuntu-latest
    needs: secrets
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep OWASP and secrets rules
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep:latest semgrep scan \
              --config p/owasp-top-ten \
              --config p/secrets \
              --error \
              --metrics=off \
              --sarif \
              --output semgrep.sarif \
              .

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  container:
    name: Container / Trivy
    runs-on: ubuntu-latest
    needs: sast
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image when Dockerfile is runnable
        id: dockerfile
        run: |
          if grep -Eq '^[[:space:]]*FROM[[:space:]]+' app/Dockerfile; then
            docker build --pull --tag azure-zerotrust-app:${{ github.sha }} app
            echo "has_image=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dockerfile has no FROM instruction yet; running filesystem scan instead."
            echo "has_image=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan application image for critical CVEs
        if: steps.dockerfile.outputs.has_image == 'true'
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/repo" \
            -w /repo \
            aquasec/trivy:latest image \
              --config trivy.yaml \
              --severity CRITICAL \
              --exit-code 1 \
              azure-zerotrust-app:${{ github.sha }}

      - name: Scan app filesystem until image exists
        if: steps.dockerfile.outputs.has_image != 'true'
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            aquasec/trivy:latest fs \
              --config trivy.yaml \
              --scanners vuln,secret,misconfig \
              --severity CRITICAL \
              --exit-code 1 \
              app

  iac:
    name: IaC / Checkov
    runs-on: ubuntu-latest
    needs: container
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Checkov
        run: pipx install checkov

      - name: Run Checkov for Bicep
        continue-on-error: true
        run: |
          checkov \
            --directory infra \
            --framework bicep \
            --output cli \
            --output sarif \
            --output-file-path console,checkov.sarif \
            --soft-fail

      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov.sarif
          category: checkov

  msdo:
    name: Defender for DevOps / MSDO
    runs-on: windows-latest
    needs:
      - secrets
      - sast
      - container
      - iac
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@latest
        id: msdo
        with:
          policy: GitHub
          categories: code,artifacts,IaC,containers

      - name: Upload MSDO SARIF
        if: always() && steps.msdo.outputs.sarifFile != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
          category: msdo

      - name: Upload MSDO artifact
        if: always() && steps.msdo.outputs.sarifFile != ''
        uses: actions/upload-artifact@v4
        with:
          name: msdo-sarif
          path: ${{ steps.msdo.outputs.sarifFile }}
